version: '3.8'

services:
  finally:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finally-app
    ports:
      - "8000:8000"
    volumes:
      - finally-data:/app/db
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

volumes:
  finally-data:
    driver: local
